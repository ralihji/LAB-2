<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculatrice</title>
    <!-- Polices Google : Barlow pour le texte, Share Tech Mono pour les chiffres de l'écran -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Share+Tech+Mono&display=swap"
          rel="stylesheet">
    <!-- Feuille de style servie depuis src/main/resources/static/css/style.css -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main class="calculatrice">
    <p class="modele">Calculatrice</p>

    <!-- L'écran : affiche le texte préparé par le contrôleur (attribut "affichage" du Model) -->
    <section class="ecran" aria-label="Écran de la calculatrice">
        <span class="ecran-etiquette">Résultat</span>
        <output class="ecran-valeur" id="resultat" aria-live="polite" th:text="${affichage}">0</output>
        <span class="ecran-message"
              th:if="${calculatorForm.erreur != null}"
              th:text="${calculatorForm.erreur}">Message d'erreur</span>
    </section>

    <!-- Le formulaire est envoyé au serveur (POST /calculer) : le calcul se fait en Kotlin, pas en JavaScript -->
    <form th:action="@{/calculer}" th:object="${calculatorForm}" method="post">

        <!-- Les deux nombres : th:field les relie aux propriétés de CalculatorForm -->
        <div class="champs">
            <label class="champ" for="premierNombre">
                <span>Premier nombre</span>
                <input type="text" inputmode="decimal" autocomplete="off" placeholder="0" th:field="*{premierNombre}">
            </label>

            <label class="champ" for="secondNombre">
                <span>Second nombre</span>
                <input type="text" inputmode="decimal" autocomplete="off" placeholder="0" th:field="*{secondNombre}">
            </label>
        </div>

        <!-- Les touches : chaque bouton envoie sa propre valeur dans le paramètre "operation" -->
        <div class="touches">
            <button type="submit" class="touche" name="operation" value="+" aria-label="Additionner">+</button>
            <button type="submit" class="touche" name="operation" value="-" aria-label="Soustraire">&minus;</button>
            <button type="submit" class="touche" name="operation" value="*" aria-label="Multiplier">&times;</button>
            <button type="submit" class="touche" name="operation" value="/" aria-label="Diviser">&divide;</button>
        </div>
    </form>
</main>

</body>
</html>
