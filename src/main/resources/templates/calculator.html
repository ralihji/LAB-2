<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Calculatrice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 1.1rem;
            padding: 30px;
        }
        .field {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            width: 300px;
        }
        .field label {
            flex: 1;
        }
        .field input {
            width: 60px;
            height: 28px;
            border: 1px solid #7a9cc6;
            border-radius: 2px;
            padding: 2px 6px;
            font-size: 1rem;
        }
        .field input[readonly] {
            background: #fff;
        }
        .ops {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .ops button {
            width: 40px;
            height: 40px;
            background: #b9bec6;
            border: 1px solid #6e7581;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .ops button:hover { filter: brightness(0.95); }
        .ops button:active { filter: brightness(0.85); }
        .erreur {
            color: #b00020;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<form th:action="@{/calculer}" th:object="${calculatorForm}" method="post">

    <div class="field">
        <label for="premierNombre">Premier nombre:</label>
        <input type="number" step="any" id="premierNombre" th:field="*{premierNombre}">
    </div>

    <div class="field">
        <label for="secondNombre">Second nombre:</label>
        <input type="number" step="any" id="secondNombre" th:field="*{secondNombre}">
    </div>

    <div class="field">
        <label for="resultat">Resultat:</label>
        <input type="text" id="resultat" th:value="${calculatorForm.resultat}" readonly>
    </div>

    <div class="ops">
        <button type="submit" name="operation" value="+">+</button>
        <button type="submit" name="operation" value="-">-</button>
        <button type="submit" name="operation" value="*">*</button>
        <button type="submit" name="operation" value="/">/</button>
    </div>

    <p class="erreur" th:if="${calculatorForm.erreur != null}" th:text="${calculatorForm.erreur}"></p>

</form>

</body>
</html>
